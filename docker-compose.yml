services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      EVIDENCE_WORKBOOK_URL: http://localhost:3000/static/audit_dashboard_excel_simulation_revised.xlsx
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
